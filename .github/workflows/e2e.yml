name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    # Enabled in Task 7.4 once the full suite is in place.
    if: false

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @sepalo/web exec playwright install --with-deps

      - name: Build web
        run: pnpm --filter @sepalo/web build

      - name: Run e2e tests
        run: pnpm --filter @sepalo/web exec playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/web/playwright-report/
          retention-days: 7
